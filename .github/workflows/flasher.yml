name: Web Flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create tags/releases, attach .bin files
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: web-flasher
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.txt commit-distance needs full history

      # Only cut a release when something that ends up in the firmware or the
      # filesystem image actually changed. Doc-only pushes still redeploy Pages.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'src/**'
              - 'include/**'
              - 'data/**'
              - 'platformio.ini'
              - 'version.txt'
              - 'scripts/**'

      - name: Compute version
        id: version
        run: |
          set -e
          BASE=$(cat version.txt)
          LAST=$(git log -1 --format=%H -- version.txt || true)
          if [ -n "$LAST" ]; then RANGE="$LAST..HEAD"; else RANGE="HEAD"; fi
          PATCH=$(git rev-list --count $RANGE)
          VERSION="$BASE.$PATCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PUSHRELAY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PushRelay version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide secrets.h (build-time fallback only)
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        run: pio run -e esp32-wrover-kit

      - name: Build filesystem image
        run: pio run -e esp32-wrover-kit -t buildfs

      - name: Assemble site
        run: |
          set -e
          BUILD=.pio/build/esp32-wrover-kit
          mkdir -p site
          cp -r web/. site/
          cp "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$BUILD/firmware.bin" "$BUILD/littlefs.bin" site/
          cp "$(find ~/.platformio -name boot_app0.bin | head -1)" site/
          ls -la site/

      # The OTA manifest and the esp-web-tools flasher manifest have different
      # schemas and must not collide. The flasher one ships in the repo as
      # web/install.json (copied to site/ above); the OTA one is generated here
      # as site/update.json. A copy is also written to site/manifest.json for
      # devices still on firmware that fetches the old OTA_MANIFEST_URL.
      - name: Build update manifest
        run: |
          set -e
          BUILD=.pio/build/esp32-wrover-kit
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha "$(git rev-parse --short HEAD)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(git log -1 --pretty=%s)" \
            --arg fw_sha "$(sha256sum "$BUILD/firmware.bin" | cut -d' ' -f1)" \
            --argjson fw_size "$(stat -c%s "$BUILD/firmware.bin")" \
            --arg fs_sha "$(sha256sum "$BUILD/littlefs.bin" | cut -d' ' -f1)" \
            --argjson fs_size "$(stat -c%s "$BUILD/littlefs.bin")" \
            '{version:$version, sha:$sha, date:$date, notes:$notes, min_version:"0.0.0",
              firmware:{path:"firmware.bin", sha256:$fw_sha, size:$fw_size},
              filesystem:{path:"littlefs.bin", sha256:$fs_sha, size:$fs_size}}' \
            > site/update.json
          cp site/update.json site/manifest.json
          cat site/update.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Immutable per-version copy of everything, for humans and for rollback.
      # The device itself updates from the Pages copies above (no redirects, no
      # API rate limit); these assets are the archive.
      - name: Publish release
        if: steps.filter.outputs.firmware == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Automated build of `${{ github.sha }}`.

            ${{ github.event.head_commit.message }}
          files: |
            site/update.json
            site/manifest.json
            site/bootloader.bin
            site/partitions.bin
            site/boot_app0.bin
            site/firmware.bin
            site/littlefs.bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
