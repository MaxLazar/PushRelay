<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8FE8"/>
      <stop offset="1" stop-color="#4675D1"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>

  <!-- Phone frame - deliberately open on the right for the forwarding mark -->
  <path d="M390 175
           H634
           C680 175 716 211 716 257
           V365
           M716 650
           V766
           C716 812 680 848 634 848
           H390
           C344 848 308 812 308 766
           V257
           C308 211 344 175 390 175 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- iPhone-style notch -->
  <path d="M425 176
           H599
           C599 207 579 226 549 226
           H475
           C445 226 425 207 425 176 Z"
        fill="#FFFFFF"/>

  <!-- Home indicator -->
  <rect x="441" y="795" width="110" height="13" rx="6.5" fill="#FFFFFF"/>

  <!-- Clean forwarding symbol -->
  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="48"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M520 425 L595 500 L520 575"/>
    <path d="M635 425 L710 500 L635 575"/>
  </g>
</svg>